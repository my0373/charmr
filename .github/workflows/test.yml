name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, devel]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/charmr_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Run migrations
        run: python manage.py migrate --run-syncdb

      - name: Seed data
        run: python manage.py seed_data

      - name: Run Django system checks
        run: python manage.py check --deploy --fail-level WARNING 2>&1 || true

      - name: Run tests
        run: python manage.py test --verbosity=2

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile.prod -t charmr-backend:test backend/

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile.prod -t charmr-frontend:test frontend/
